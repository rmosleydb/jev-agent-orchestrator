command:
  - sh
  - -c
  - uvicorn app:app --host 0.0.0.0 --port ${DATABRICKS_APP_PORT:-8080}

env:
  - name: JEV_API_KEY
    valueFrom: jev-api-key
  - name: JEV_LOG_PROMPT
    value: "1"
  - name: GUARDRAIL_NAME
    value: "Jailbreak (JEV)"
  - name: ORCH_ALLOW_RAW_BEARER
    value: "0"
  - name: MCP_LOAD_TIMEOUT
    value: "30"
